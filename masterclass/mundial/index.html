<!doctype html>
<!-- Versión corregida con controles de navegación -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>De 3, 2, 1… a una decisión · Masterclass Data Analyst</title>
  <style>
    :root{
      --color-black:#000000;--color-white:#ffffff;--color-violet-light:#dbc5fc;
      --surface-dark:#141414;--gradient-brand:linear-gradient(90deg,#141414 0%,#8271cc 50%,#141414 100%);
      --font-display:"Inter",ui-sans-serif,sans-serif;--font-body:"Inter",ui-sans-serif,system-ui,sans-serif;
      --duration-fast:160ms;--duration-base:240ms;--ease-standard:cubic-bezier(.2,.8,.2,1);
      --line:rgba(255,255,255,.16);--glass:rgba(255,255,255,.07);--cyan:var(--color-violet-light);
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:var(--font-body)}
    .deck{height:100%;position:relative}
    .hud{height:64px;padding:0 4.5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
    main{height:calc(100% - 64px);position:relative}
    .slide{display:none;position:absolute;inset:0;padding:5.2vh 6.2vw;place-items:center;text-align:center}
    .slide.active{display:grid}
    .display{font-family:var(--font-display);font-size:clamp(46px,6.8vw,98px);line-height:.91;letter-spacing:-.068em;margin:0}
    .sequence{display:flex;align-items:center;justify-content:center;gap:clamp(16px,3vw,48px);font-size:clamp(92px,16vw,230px);font-weight:950;line-height:.8}
    .unknown{color:var(--cyan);animation:pulse 1.5s ease-in-out infinite}
    @keyframes pulse{50%{transform:scale(1.08)}}
    
    /* Controles de navegación */
    .controls{position:fixed;z-index:20;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:8px;background:rgba(0,0,0,.76);border:1px solid var(--line);backdrop-filter:blur(12px);border-radius:999px;padding:6px}
    .controls button{border:none;background:rgba(255,255,255,.1);color:#fff;width:40px;height:40px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
    .controls button:hover{background:var(--cyan);color:#000}
  </style>
</head>
<body>
  <div class="deck">
    <header class="hud">
      <div style="font-weight:950;text-transform:uppercase">Unicorn Academy</div>
      <div id="counter">01 / 01</div>
    </header>
    
    <main id="slides">
      <section class="slide active">
        <div>
          <h1 class="display">¿Qué número viene ahora?</h1>
          <div class="sequence"><span>3</span><span>2</span><span>1</span><span class="unknown">?</span></div>
        </div>
      </section>
      <!-- Agrega más secciones aquí -->
    </main>

    <div class="controls">
      <button onclick="prevSlide()">←</button>
      <button onclick="nextSlide()">→</button>
    </div>
  </div>

  <script>
    let currentSlide = 0;
    const slides = document.querySelectorAll('.slide');
    const counter = document.getElementById('counter');
    
    function update() {
      slides.forEach((s, i) => s.classList.toggle('active', i === currentSlide));
      counter.innerText = `${String(currentSlide + 1).padStart(2, '0')} / ${slides.length}`;
    }
    
    function nextSlide() {
      if(currentSlide < slides.length - 1) { currentSlide++; update(); }
    }
    
    function prevSlide() {
      if(currentSlide > 0) { currentSlide--; update(); }
    }
    
    update();
  </script>
</body>
</html>
