:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --board:#E9ECF2; --dot:#C3C9D6; --ink:#1C2130; --ink-soft:#4A5268; --paper:#FFFFFF;
  --line:#D5DAE4; --violet:#5B3DF5; --violet-soft:#E6E0FF;
  --yellow:#FFE072; --peach:#FFC9A3; --pink:#FFB9CB; --blue:#BCDBFF; --lilac:#D8CCFF; --mint:#B6EACF;
  --sticky-shadow:0 1px 0 rgba(28,33,48,.08), 0 10px 18px -12px rgba(28,33,48,.45);
  --ui:#FFFFFF; --ui-border:#D5DAE4;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, -apple-system, sans-serif;
  --hand:"Kalam", "Comic Sans MS", "Segoe Print", cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --board:#161A24; --dot:#2E3547; --ink:#EEF0F6; --ink-soft:#AEB5C8; --paper:#212735;
    --line:#343C50; --violet:#9C88FF; --violet-soft:#2E2856;
    --yellow:#E8C95A; --peach:#E6AE88; --pink:#E9A0B3; --blue:#9DC1EA; --lilac:#B9A9F0; --mint:#96CFB2;
    --ui:#212735; --ui-border:#343C50;
  }
}
:root[data-theme="dark"]{
  --board:#161A24; --dot:#2E3547; --ink:#EEF0F6; --ink-soft:#AEB5C8; --paper:#212735;
  --line:#343C50; --violet:#9C88FF; --violet-soft:#2E2856;
  --yellow:#E8C95A; --peach:#E6AE88; --pink:#E9A0B3; --blue:#9DC1EA; --lilac:#B9A9F0; --mint:#96CFB2;
  --ui:#212735; --ui-border:#343C50;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--board);color:var(--ink);font-family:var(--display);overflow:hidden;-webkit-font-smoothing:antialiased}

#viewport{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;
  background-color:var(--board);
  background-image:radial-gradient(var(--dot) 1.2px, transparent 1.3px);
  background-size:24px 24px}
#viewport.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#world.animate{transition:transform .45s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion: reduce){#world.animate{transition:none}}
#wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}

/* Frames */
.frame{position:absolute;background:var(--paper);border:1.5px solid var(--line);border-radius:6px;padding:28px 36px 40px}
.frame-tab{position:absolute;top:-38px;left:0;display:flex;gap:10px;align-items:center;
  font-size:19px;font-weight:500;color:var(--ink-soft);cursor:move;user-select:none;padding:4px 2px}
.frame-tab b{color:var(--ink);font-weight:700}
.frame h2{font-size:46px;line-height:1.05;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
.frame .lead{font-size:20px;color:var(--ink-soft);margin:0 0 28px;max-width:60ch;line-height:1.4}

.sticky{position:relative;padding:22px 24px 24px;border-radius:2px 2px 4px 14px;box-shadow:var(--sticky-shadow);
  color:#1C2130;cursor:grab;user-select:none;touch-action:none}
.sticky.dragging{cursor:grabbing;box-shadow:0 20px 34px -14px rgba(0,0,0,.55);z-index:5}
.y{background:var(--yellow)}.p{background:var(--pink)}.b{background:var(--blue)}.l{background:var(--lilac)}.m{background:var(--mint)}

/* Ficha */
.card-table{width:100%;border-collapse:collapse;font-size:19px}
.card-table th{text-align:left;font-weight:500;color:var(--ink-soft);padding:11px 18px 11px 0;width:36%;vertical-align:top;border-bottom:1px dashed var(--line)}
.card-table td{padding:11px 0;font-weight:500;border-bottom:1px dashed var(--line);line-height:1.35}
.card-table td i{font-style:italic}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:15px;padding:4px 12px;border-radius:999px;background:var(--violet-soft);color:var(--ink);font-weight:500}
.question{margin-top:30px;transform:rotate(-1.2deg)}
.question small{display:block;font-size:15px;font-weight:500;opacity:.7;margin-bottom:6px}
.question p{font-family:var(--hand);font-size:30px;line-height:1.2;margin:0;font-weight:700}

.ficha-top{display:flex;gap:30px;align-items:flex-start;margin-bottom:26px}
.cover{flex:0 0 190px;width:190px;border-radius:3px;box-shadow:0 2px 0 rgba(0,0,0,.06),0 18px 30px -16px rgba(28,33,48,.55);transform:rotate(-2deg);display:block}
.ficha-top .lead{margin-bottom:0}
/* Idea central */
.idea-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:26px;margin-bottom:44px}
.idea-grid .sticky h3{font-family:var(--hand);font-size:25px;margin:0 0 10px;font-weight:700}
.idea-grid .sticky p{font-size:17px;line-height:1.45;margin:0}
.shift{display:flex;flex-direction:column;gap:8px;font-size:17px}
.shift s{opacity:.6}
.shift strong{font-weight:700}
.chain-wrap{border:2px dashed var(--violet);border-radius:18px;padding:26px 28px 30px;position:relative}
.chain-label{position:absolute;top:-15px;left:24px;background:var(--paper);padding:0 10px;font-size:17px;font-weight:700;color:var(--violet)}
.chain{display:flex;align-items:center;justify-content:space-between;gap:6px}
.node{flex:1 1 0;text-align:center;background:var(--board);border:2px solid var(--ink);border-radius:14px;padding:18px 8px;font-size:23px;font-weight:800;letter-spacing:-.01em;min-width:0}
.node:last-child{background:var(--violet);color:#fff;border-color:var(--violet)}
.chain .arw{flex:0 0 auto;font-size:30px;color:var(--violet);font-weight:700}
.remember{margin-top:34px;display:flex;justify-content:center}
.remember .sticky{max-width:760px;transform:rotate(.8deg);text-align:center}
.remember p{font-family:var(--hand);font-size:31px;line-height:1.25;margin:0;font-weight:700}

/* Aprendizajes */
.learn-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:28px}
.learn .num{font-size:15px;font-weight:700;opacity:.55}
.learn h3{font-family:var(--hand);font-size:27px;line-height:1.15;margin:4px 0 12px;font-weight:700}
.learn .what{font-size:16.5px;line-height:1.45;margin:0 0 14px}
.learn .how{font-size:16px;line-height:1.45;margin:0;padding-top:12px;border-top:1.5px solid rgba(28,33,48,.18)}
.learn .how span{display:block;font-weight:700;font-size:14px;margin-bottom:3px;opacity:.7}

/* Frameworks */
.fw-list{display:flex;flex-direction:column;gap:22px}
.fw{background:var(--board);border:1.5px solid var(--line);border-radius:10px;padding:18px 22px 20px;cursor:grab;user-select:none;touch-action:none}
.fw.dragging{cursor:grabbing;box-shadow:0 20px 34px -14px rgba(0,0,0,.45);position:relative;z-index:5}
.fw-head{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin-bottom:12px}
.fw-head h3{font-size:24px;margin:0;font-weight:700;letter-spacing:-.01em}
.fw-type{font-size:14px;font-weight:700;padding:4px 11px;border-radius:999px;white-space:nowrap;color:#1C2130}
.fw-type.syn{background:var(--lilac)}
.fw-type.rec{background:var(--mint)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 6px;margin-bottom:12px}
.chip{background:var(--lilac);color:#1C2130;padding:7px 13px;border-radius:6px;font-size:17px;font-weight:500;box-shadow:0 1px 0 rgba(0,0,0,.12)}
.fw.rec .chip{background:var(--mint)}
.flow .arw{color:var(--ink-soft);font-weight:700}
.fw p{margin:0;font-size:16.5px;color:var(--ink-soft);line-height:1.4}
.fw-note{font-size:15px;color:var(--ink-soft);margin:-12px 0 24px;line-height:1.45;max-width:70ch}

/* Frases */
.quote-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:30px}
.quote .num{font-size:15px;font-weight:700;opacity:.55;margin-bottom:6px}
.quote p{font-family:var(--hand);font-size:27px;line-height:1.28;margin:0;font-weight:400}


/* Cabecera de marca */
#brand{position:absolute;display:flex;align-items:center;gap:36px;padding:26px 36px;background:var(--paper);border:1.5px solid var(--line);border-radius:6px}
#brand .logo{flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-width:120px;height:96px}
#brand .logo{gap:18px}
#brand .logo img{height:96px;width:auto;display:block;border-radius:14px}
#brand .brand-name{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.05;max-width:7ch}
#brand .wordmark{display:flex;flex-direction:column;justify-content:center;background:var(--violet);color:#fff;border-radius:14px;padding:14px 22px;font-weight:800;font-size:26px;line-height:1;letter-spacing:-.01em}
#brand .wordmark span{font-weight:500;font-size:17px;margin-top:6px;opacity:.85}
#brand .titles{flex:1 1 auto;border-left:2px solid var(--line);padding-left:36px}
#brand h1{margin:0;font-size:58px;font-weight:800;letter-spacing:-.025em;line-height:1}
#brand .titles p{margin:10px 0 0;font-size:21px;color:var(--ink-soft)}
#brand .meta{flex:0 0 auto;text-align:right;font-size:18px;color:var(--ink-soft);line-height:1.5}
#brand .meta b{color:var(--ink);font-weight:700}


/* Etapas */
.stairs{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;align-items:end}
.step{border-radius:14px 14px 4px 4px;padding:28px 32px 30px;color:#1C2130;display:flex;flex-direction:column;gap:10px;cursor:grab;user-select:none;touch-action:none}
.step .lvl{font-size:46px;font-weight:800;line-height:1;letter-spacing:-.03em;opacity:.8}
.step h3{font-size:34px;margin:0;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.step .en{font-size:15px;font-style:italic;opacity:.7;margin-top:-4px}
.step p{margin:0;font-size:20px;line-height:1.45;max-width:36ch}
.step .signal{margin-top:auto;padding-top:14px;border-top:1.5px solid rgba(28,33,48,.22);font-family:var(--hand);font-size:27px;line-height:1.25}
.step .signal small{display:block;font-family:var(--display);font-size:14px;font-weight:700;opacity:.65;margin-bottom:2px}
.s1{background:#E6F6EE;min-height:360px}.s2{background:#CFEFDE;min-height:430px}.s3{background:#B2E6CB;min-height:500px}.s4{background:#8ED8B1;min-height:570px}.s5{background:#5CC592;min-height:640px}
.stairs-axis{display:flex;align-items:center;gap:16px;margin-top:22px;font-size:20px;font-weight:500;color:var(--ink-soft)}
.stairs-axis i{flex:1;height:2px;background:var(--ink-soft);position:relative}
.stairs-axis i::after{content:"";position:absolute;right:-2px;top:-6px;border:7px solid transparent;border-left:10px solid var(--ink-soft)}
/* Rasgos */
.traits{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.trait h3{font-family:var(--hand);font-size:27px;line-height:1.15;margin:0 0 10px;font-weight:700}
.trait p{margin:0;font-size:17.5px;line-height:1.45}
/* Casos */
.cases{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.case{background:var(--board);border:1.5px solid var(--line);border-radius:10px;overflow:hidden;cursor:grab;user-select:none;touch-action:none}
.case.dragging,.step.dragging,.qcard.dragging{box-shadow:0 20px 34px -14px rgba(0,0,0,.45);position:relative;z-index:5}
.case .band{background:var(--peach);padding:16px 20px;color:#1C2130}
.case .band h3{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em}
.case .band span{font-size:15px;font-weight:500;opacity:.75}
.case .body{padding:16px 20px 20px}
.case small{display:block;font-size:14px;font-weight:700;color:var(--ink-soft);margin-bottom:4px}
.case p{margin:0 0 14px;font-size:17.5px;line-height:1.45}
.lever{display:inline-block;font-size:15px;font-weight:700;padding:4px 12px;border-radius:999px;border:1.5px solid var(--ink);}
/* Personas */
.people{display:flex;flex-direction:column;gap:24px}
.person{display:grid;grid-template-columns:72px 1fr;gap:20px;align-items:start}
.avatar{width:72px;height:72px;border-radius:50%;background:rgba(28,33,48,.12);display:flex;align-items:center;justify-content:center;font-family:var(--hand);font-size:34px;font-weight:700}
.person h3{font-family:var(--hand);font-size:27px;margin:0;font-weight:700;line-height:1.15}
.person .en{font-size:15px;font-style:italic;opacity:.7;margin:2px 0 8px}
.person p{margin:0;font-size:17.5px;line-height:1.45}
/* Eras */
.eras{display:grid;grid-template-columns:repeat(4,1fr);border-top:3px solid var(--ink);margin-top:16px}
.era{padding:26px 32px 8px;border-left:1.5px dashed var(--line);position:relative;cursor:grab;user-select:none;touch-action:none}
.era:first-child{border-left:0}
.era::before{content:"";position:absolute;top:-11px;left:-10px;width:19px;height:19px;border-radius:50%;background:var(--violet)}
.era:first-child::before{left:0}
.era .v{font-size:96px;font-weight:800;letter-spacing:-.05em;line-height:.95;color:var(--violet)}
.era h3{font-size:28px;margin:8px 0 18px;font-weight:800;letter-spacing:-.01em}
.era dt{font-size:14px;font-weight:700;color:var(--ink-soft);margin-bottom:3px}
.era dd{margin:0 0 16px;font-size:17.5px;line-height:1.45;max-width:40ch}
/* Preguntas */
.qs{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.qcard{background:var(--paper);border:2px solid var(--violet);border-radius:10px;padding:22px 24px;cursor:grab;user-select:none;touch-action:none}
.qcard .num{font-size:15px;font-weight:700;color:var(--violet);margin-bottom:6px}
.qcard p{font-size:21px;font-weight:700;margin:0 0 14px;line-height:1.3;letter-spacing:-.005em}
.qcard textarea{display:block;width:100%;min-height:170px;border:0;resize:vertical;font-family:var(--hand);font-size:22px;line-height:34px;color:var(--ink);background:repeating-linear-gradient(transparent,transparent 33px,var(--line) 33px,var(--line) 34px);padding:0 2px;cursor:text;user-select:text}
.qcard textarea:focus-visible{outline:2px solid var(--violet);outline-offset:4px;border-radius:2px}
#toolbar select{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--ui-border);background:var(--ui);color:var(--ink);border-radius:8px;padding:7px 8px;max-width:190px}
#toolbar select:focus-visible{outline:2px solid var(--violet)}



/* Storytelling with Data */
.ask{margin:0;padding-left:1.3em;font-size:17px;line-height:1.55}
.charts{display:grid;grid-template-columns:repeat(6,1fr);gap:22px}
.chartcard{background:var(--mint);color:#1C2130;border-radius:2px 2px 4px 14px;box-shadow:var(--sticky-shadow);padding:22px 22px 24px}
.chartcard svg{display:block;width:100%;height:120px;margin-bottom:16px}
.chartcard small{display:block;font-size:14px;font-weight:700;opacity:.65;margin-bottom:4px}
.chartcard h3{margin:0;font-family:var(--hand);font-size:27px;font-weight:700;line-height:1.15}
.guide-foot{margin-top:28px;font-size:19px;color:var(--ink-soft);max-width:70ch}
.guide-foot b{color:var(--ink)}
.demo{display:grid;grid-template-columns:1fr 1fr;gap:36px}
.panel{background:var(--board);border:1.5px solid var(--line);border-radius:12px;padding:24px 30px 26px}
.pill{display:inline-block;font-size:15px;font-weight:700;padding:4px 12px;border-radius:999px;margin-bottom:12px}
.pill.bad{background:var(--line);color:var(--ink)}
.pill.good{background:var(--violet);color:#fff}
.panel h3{margin:0 0 4px;font-size:27px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.panel .sub{margin:0 0 14px;font-size:16px;color:var(--ink-soft)}
.panel svg{display:block;width:100%;height:auto}
.panel .why{margin:16px 0 0;font-size:17px;line-height:1.45;color:var(--ink-soft)}
.bignum{font-size:110px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:10px 0 6px}
.context-line{font-size:30px;font-weight:700;line-height:1.25;letter-spacing:-.01em;margin:10px 0 18px;max-width:30ch}
.caps{display:flex;flex-direction:column;gap:18px}
.cap{display:grid;grid-template-columns:1.1fr 1.4fr 1fr;gap:18px;align-items:center;background:var(--peach);color:#1C2130;border-radius:2px 2px 4px 14px;box-shadow:var(--sticky-shadow);padding:18px 22px}
.cap h3{margin:0;font-family:var(--hand);font-size:26px;font-weight:700;line-height:1.1}
.cap p{margin:0;font-size:16.5px;line-height:1.4}
.cap .use{font-weight:700}
.caps-foot{margin-top:24px;font-family:var(--hand);font-size:28px;font-weight:700;line-height:1.25}
.fw .plus{color:var(--ink-soft);font-weight:800}


/* Métricas y KPIs */
.split{display:grid;grid-template-columns:1fr 1fr;gap:56px;margin-top:10px}
.split3{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:48px;margin-top:10px}
.sub-h{font-size:26px;font-weight:800;letter-spacing:-.01em;margin:0 0 16px}
.sec{margin-top:40px}
.qrows{display:flex;flex-direction:column;gap:10px}
.qrow{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:center;background:var(--board);border-radius:10px;padding:13px 18px;font-size:19px;line-height:1.35}
.qrow b{font-weight:700}
.qrow .ans{color:var(--ink-soft)}
.cols4{display:grid;grid-template-columns:repeat(4,1fr);gap:26px}
.ccard{padding:26px 28px 28px}
.ccard .verb{font-size:15px;font-weight:700;opacity:.65}
.ccard h3{font-size:34px;font-weight:800;margin:2px 0 10px;letter-spacing:-.015em;line-height:1.05}
.ccard .q{font-family:var(--hand);font-size:28px;font-weight:700;line-height:1.15;margin:0 0 16px}
.ccard dl{margin:0}
.ccard dt{font-size:14px;font-weight:700;opacity:.65;margin-top:12px}
.ccard dd{margin:2px 0 0;font-size:18px;line-height:1.4}
.ccard .ex{margin-top:16px;background:rgba(255,255,255,.7);border-radius:8px;padding:10px 14px;font-weight:800;font-size:20px}
.verbs{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:34px 0 0;font-size:24px;font-weight:700}
.verbs span{padding:10px 18px;border-radius:10px;color:#1C2130}
.verbs i{font-style:normal;color:var(--ink-soft)}
.lrn-wide{margin-top:40px;max-width:1400px;transform:rotate(-.4deg)}
.lrn-wide small{display:block;font-size:15px;font-weight:700;opacity:.65;margin-bottom:6px}
.lrn-wide p{font-family:var(--hand);font-size:34px;line-height:1.25;margin:0;font-weight:700}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:18px;font-size:40px;font-weight:800;margin:6px 0 34px}
.eq span{padding:12px 24px;border-radius:12px;color:#1C2130}
.eq i{font-style:normal;color:var(--violet)}
.pairs{display:flex;flex-direction:column;gap:12px}
.pair{display:grid;grid-template-columns:1fr 50px 1.3fr;align-items:center}
.pair div{border-radius:10px;padding:14px 18px;font-size:20px;font-weight:700;color:#1C2130}
.pair .a{background:var(--blue)}
.pair .b{background:var(--mint)}
.pair b{color:var(--violet);text-align:center;font-size:30px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp .h{font-size:16px;font-weight:800;padding:0 4px;color:var(--ink-soft)}
.cmp div.c{background:var(--board);border-radius:8px;padding:11px 16px;font-size:18.5px;line-height:1.35}
.cmp div.c.k{background:color-mix(in srgb, var(--mint) 45%, var(--paper))}
.cmp div.c.n{background:color-mix(in srgb, var(--lilac) 45%, var(--paper))}
.cmp div.c.m{background:color-mix(in srgb, var(--blue) 45%, var(--paper))}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.tile{border-radius:12px;padding:18px 22px;color:#1C2130}
.tile small{display:block;font-size:15px;font-weight:700;opacity:.65}
.tile b{display:block;font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:4px 0}
.tile span{font-family:var(--hand);font-size:22px;font-weight:700}
.filter{margin-top:22px;transform:rotate(.6deg)}
.filter p{margin:0;font-family:var(--hand);font-size:28px;line-height:1.25;font-weight:700}
.filter small{display:block;font-size:15px;font-weight:700;opacity:.65;margin-bottom:6px}
.journey{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-top:4px}
.jstep{background:var(--board);padding:16px 18px;border-right:3px solid var(--paper);position:relative}
.jstep:first-child{border-radius:12px 0 0 12px}
.jstep:last-child{border-radius:0 12px 12px 0;border-right:0;background:var(--lilac);color:#1C2130}
.jstep b{display:block;font-size:22px;font-weight:800;margin-bottom:6px}
.jstep p{margin:0 0 8px;font-size:17px;line-height:1.35}
.jstep i{font-style:normal;font-size:16px;color:var(--ink-soft);line-height:1.35;display:block}
.jstep:last-child i{color:#1C2130;opacity:.75}
.nsm{padding:24px 28px;transform:rotate(-.5deg)}
.nsm small{font-size:15px;font-weight:700;opacity:.65}
.nsm h3{margin:4px 0 12px;font-family:var(--hand);font-size:34px;line-height:1.15;font-weight:700}
.nsm p{margin:0 0 10px;font-size:18px;line-height:1.4}
.nsm .warn{background:rgba(255,255,255,.7);border-radius:8px;padding:10px 14px;font-weight:700}
.hier{display:flex;flex-direction:column;align-items:center;gap:8px}
.lvl{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;border-radius:12px;padding:14px 22px;color:#1C2130}
.lvl b{font-size:24px;font-weight:800}
.lvl span{font-size:18px;line-height:1.3}
.lvl span em{font-style:normal;display:block;font-size:14px;font-weight:700;opacity:.65}
.hier .down{font-size:28px;color:var(--violet);font-weight:800;line-height:1}
.lvl.proc{background:var(--board);color:var(--ink);border:2px dashed var(--line)}
.tags7{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.t7{border-radius:10px;padding:13px 16px;color:#1C2130}
.t7 small{display:block;font-size:14px;font-weight:800;opacity:.7}
.t7 b{display:block;font-size:20px;margin:2px 0}
.t7 span{font-size:16px;line-height:1.35;display:block;opacity:.85}
.big-idea{font-size:54px;font-weight:800;letter-spacing:-.025em;line-height:1.08;margin:0 0 34px;max-width:28ch}
.steps7{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px}
.steps7 div{flex:1 1 0;min-width:0;background:var(--board);border-radius:10px;padding:14px 14px 16px}
.steps7 b{display:block;font-size:20px;font-weight:800;margin-bottom:4px}
.steps7 b em{font-style:normal;color:var(--violet);margin-right:6px}
.steps7 span{font-size:16.5px;line-height:1.35;color:var(--ink-soft)}
.closing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin:10px 0 30px}
.closing-grid div{background:var(--board);border-radius:12px;padding:18px 22px}
.closing-grid small{display:block;font-size:15px;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
.closing-grid p{margin:0;font-size:20px;line-height:1.4}
.last-line{font-size:42px;font-weight:800;letter-spacing:-.02em;line-height:1.15;max-width:40ch;margin:0}
.last-line em{font-style:normal;color:var(--violet)}
.hook-q{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1.12;margin:0 0 24px}
.hook-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.hook-grid .sticky small{display:block;font-size:15px;font-weight:700;opacity:.65;margin-bottom:6px}
.hook-grid .sticky p{margin:0;font-size:19px;line-height:1.45}
.hook-grid .sticky p.h{font-family:var(--hand);font-size:28px;font-weight:700;line-height:1.2}
.case{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.case .tile b{font-size:44px}
.case-foot{margin:22px 0 0;font-size:18px;color:var(--ink-soft);line-height:1.45}


/* Versión ligera: menos elementos, más grandes */
.lite .lead{font-size:24px}
.lite h2{font-size:54px}
.big-q{font-size:60px;font-weight:800;letter-spacing:-.03em;line-height:1.06;margin:6px 0 36px;max-width:20ch}
.thread{transform:rotate(-1deg);max-width:760px}
.thread small{display:block;font-size:16px;font-weight:700;opacity:.65;margin-bottom:6px}
.thread p{margin:0;font-family:var(--hand);font-size:44px;font-weight:700;line-height:1.15}
.case.lite-case .tile{padding:22px 26px}
.case.lite-case .tile b{font-size:52px}
.case.lite-case .tile small{font-size:17px}
.case.lite-case .tile span{font-size:25px}
.cc-lite{padding:32px 34px 34px}
.cc-lite .verb{font-size:17px}
.cc-lite h3{font-size:46px}
.cc-lite .q{font-size:36px;margin-bottom:22px}
.cc-lite .ex{font-size:24px;padding:14px 18px}
.eq.xl{font-size:48px;gap:20px;margin-bottom:40px}
.eq.xl span{padding:16px 28px}
.transform{display:grid;grid-template-columns:1fr 70px 1.4fr;align-items:center;margin-bottom:34px}
.transform .tile b{font-size:46px}
.transform > b{font-size:48px;color:var(--violet);text-align:center}
.take{transform:rotate(-.6deg)}
.take small{display:block;font-size:16px;font-weight:700;opacity:.65;margin-bottom:6px}
.take p{margin:0;font-family:var(--hand);font-size:36px;line-height:1.2;font-weight:700}
.duo.xl .tile b{font-size:52px}
.duo.xl .tile span{font-size:25px}
.ns-row{display:grid;grid-template-columns:1.7fr 1fr;gap:50px;align-items:stretch}
.journey.lite-j .jstep{padding:22px 22px}
.journey.lite-j .jstep b{font-size:28px}
.journey.lite-j .jstep p{font-size:21px;margin:0}
.nsm.lite-n h3{font-size:40px}
.nsm.lite-n p{font-size:20px}
.sys{display:grid;grid-template-columns:1.8fr 1fr;gap:60px;align-items:center}
.pyr{display:flex;flex-direction:column;align-items:center;gap:10px}
.pl{border-radius:14px;padding:18px 26px;color:#1C2130;text-align:center}
.pl .t{font-size:30px;font-weight:800}
.pl .q{font-size:20px;opacity:.8;margin-top:2px}
.pl .chips-l{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}
.pl .chips-l span{background:rgba(255,255,255,.75);border-radius:8px;padding:7px 14px;font-size:20px;font-weight:700}
.pl.proc{background:var(--board);color:var(--ink);border:2px dashed var(--line)}
.pyr .down{font-size:30px;color:var(--violet);font-weight:800;line-height:1}
.outside{border:3px dashed var(--peach);border-radius:18px;padding:26px 28px}
.outside small{display:block;font-size:16px;font-weight:700;color:var(--ink-soft);margin-bottom:10px}
.outside .tile b{font-size:48px}
.outside p{margin:16px 0 0;font-family:var(--hand);font-size:30px;font-weight:700;line-height:1.2}

/* Solo lectura */
.drag,.sticky,.fw,.case,.step,.era,.qcard{cursor:inherit!important}
.frame-tab{cursor:inherit}
.frame{cursor:zoom-in}
.zoomed .frame{cursor:inherit}
.qcard{padding-bottom:26px}
.qcard p{margin-bottom:0}
/* CTA */
.cta-btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:700;text-decoration:none;border-radius:10px;padding:9px 15px;font-size:14px;border:1.5px solid var(--violet);color:var(--violet);background:transparent;white-space:nowrap}
.cta-btn.primary{background:var(--violet);color:#fff}
.cta-btn:hover{filter:brightness(1.08)}
.cta-btn:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
#cta{top:calc(14px + env(safe-area-inset-top,0px));right:14px;padding:8px;display:flex;gap:8px}
body #legend{top:auto;right:auto;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.closing{display:flex;align-items:center;justify-content:space-between;gap:60px}
.closing h2{font-size:64px;max-width:18ch}
.closing .lead{font-size:24px;margin-bottom:0;max-width:52ch}
.closing .actions{display:flex;flex-direction:column;gap:18px;flex:0 0 auto}
.closing .cta-btn{font-size:26px;padding:20px 34px;border-radius:14px;border-width:2.5px;justify-content:center}
#brand .meta a{color:var(--violet);font-weight:700;text-decoration:none}
@media (max-width:720px){#title{max-width:calc(100vw - 200px)}#title p{display:none}}
@media (max-width:1100px){body #legend{display:none}}

/* UI */
.ui{position:fixed;z-index:10;background:var(--ui);border:1px solid var(--ui-border);border-radius:12px;
  box-shadow:0 8px 24px -12px rgba(0,0,0,.35);color:var(--ink)}
#title{top:calc(14px + env(safe-area-inset-top,0px));left:14px;padding:10px 16px;max-width:calc(100vw - 28px)}
#title{display:flex;align-items:center;gap:12px}
#title img{width:38px;height:38px;border-radius:8px;display:block}
#title h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.01em}
#title p{font-size:13px;margin:2px 0 0;color:var(--ink-soft)}
#legend{top:calc(14px + env(safe-area-inset-top,0px));right:14px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;font-size:13px}
#legend div{display:flex;align-items:center;gap:8px}
#legend i{width:14px;height:14px;border-radius:2px 2px 2px 5px;display:inline-block}
#toolbar{left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:6px;display:flex;gap:4px;align-items:center;max-width:calc(100vw - 20px);overflow-x:auto}
#toolbar button{font:inherit;font-size:14px;font-weight:500;border:0;background:transparent;color:var(--ink);padding:8px 11px;border-radius:8px;cursor:pointer;white-space:nowrap}
#toolbar button:hover{background:var(--violet-soft)}
#toolbar button:focus-visible{outline:2px solid var(--violet);outline-offset:1px}
#toolbar .sep{width:1px;height:22px;background:var(--ui-border);margin:0 4px;flex:0 0 auto}
#zoomLabel{min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
#hint{bottom:calc(72px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);padding:7px 14px;font-size:13px;color:var(--ink-soft);white-space:nowrap;transition:opacity .6s}
@media (max-width:720px){#legend{display:none}#hint{display:none}.frames-nav{display:none}}

#sections{left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));padding:6px;display:flex;gap:4px;max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:thin}
#sections button{font:inherit;font-size:14px;font-weight:500;border:0;background:transparent;color:var(--ink);padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px}
#sections button i{font-style:normal;font-size:12px;font-weight:700;color:var(--ink-soft)}
#sections button:hover{background:var(--violet-soft)}
#sections button.active{background:var(--violet);color:#fff}
#sections button.active i{color:#fff;opacity:.8}
#sections button:focus-visible{outline:2px solid var(--violet);outline-offset:1px}
@media (min-width:1100px){#sections{max-width:calc(100vw - 380px)}}
#hint{bottom:calc(134px + env(safe-area-inset-bottom,0px))!important}
</style>

// Layout por filas; el ancho total lo marca la primera fila
const GAP = 110, M = 80;
const ROWS = [
  [["hook",1300],["case",1300]],
  [["concepts",0]],
  [["kpi",1300],["vanity",1300]],
  [["ns",0]],
  [["system",0]],
  [["closing",0]]
];
const W = ROWS[0].reduce((a,[,w])=>a+w,0) + GAP*(ROWS[0].length-1);
function layout(){
  brand.style.left = M+"px"; brand.style.top = M+"px"; brand.style.width = W+"px";
  let y = M + brand.offsetHeight + GAP;
  ROWS.forEach(row=>{
    let x = M;
    row.forEach(([id,w])=>{ const e=els[id]; e.style.width=(w||W)+"px"; e.style.left=x+"px"; e.style.top=y+"px"; x+=(w||W)+GAP; });
    y += Math.max(...row.map(([id])=>els[id].offsetHeight)) + GAP;
  });
}

function rect(el){ return {x:el.offsetLeft, y:el.offsetTop, w:el.offsetWidth, h:el.offsetHeight}; }
function bounds(){
  let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;
  [brand, ...Object.values(els)].forEach(e=>{const r=rect(e);x1=Math.min(x1,r.x);y1=Math.min(y1,r.y-50);x2=Math.max(x2,r.x+r.w);y2=Math.max(y2,r.y+r.h);});
  return {x:x1,y:y1,w:x2-x1,h:y2-y1};
}

const LINKS = FRAMES.slice(1).map((f,i)=>[FRAMES[i].id,f.id]);
function drawWires(){
  const b = bounds();
  wires.setAttribute("width", b.x+b.w+400); wires.setAttribute("height", b.y+b.h+400);
  wireGroup.innerHTML = LINKS.map(([a,z])=>{
    const A=rect(els[a]), Z=rect(els[z]);
    const ac={x:A.x+A.w/2,y:A.y+A.h/2}, zc={x:Z.x+Z.w/2,y:Z.y+Z.h/2};
    let p1,p2,c1,c2;
    const horiz = (Z.x >= A.x+A.w) || (A.x >= Z.x+Z.w);
    if (horiz){
      const dir = zc.x>ac.x?1:-1;
      const y1 = Math.min(Math.max(zc.y, A.y+60), A.y+A.h-60);
      const y2 = Math.min(Math.max(ac.y, Z.y+60), Z.y+Z.h-60);
      p1={x:dir>0?A.x+A.w:A.x, y:y1}; p2={x:dir>0?Z.x-8:Z.x+Z.w+8, y:y2};
      const d=Math.abs(p2.x-p1.x)*.5+60; c1={x:p1.x+dir*d,y:p1.y}; c2={x:p2.x-dir*d,y:p2.y};
    } else {
      const dir = zc.y>ac.y?1:-1;
      const x1 = Math.min(Math.max(zc.x, A.x+60), A.x+A.w-60);
      const x2 = Math.min(Math.max(ac.x, Z.x+60), Z.x+Z.w-60);
      p1={x:x1, y:dir>0?A.y+A.h:A.y}; p2={x:x2, y:dir>0?Z.y-54:Z.y+Z.h+8};
      const d=Math.abs(p2.y-p1.y)*.5+40; c1={x:p1.x,y:p1.y+dir*d}; c2={x:p2.x,y:p2.y-dir*d};
    }
    return `<path d="M${p1.x},${p1.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${p2.x},${p2.y}" fill="none" stroke="var(--violet)" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>`;
  }).join("");
}

// Vista: pan y zoom
let view = {x:0,y:0,s:1};
const MIN=.08, MAX=2.5;
const zoomLabel = document.getElementById("zoomLabel");
function apply(animate=false){
  world.classList.toggle("animate", animate);
  world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.s})`;
  viewport.style.backgroundSize = `${24*view.s}px ${24*view.s}px`;
  viewport.style.backgroundPosition = `${view.x}px ${view.y}px`;
  zoomLabel.textContent = Math.round(view.s*100)+"%";
  viewport.classList.toggle("zoomed", view.s > 0.45);
}
function zoomAt(factor, sx, sy, animate=false){
  const ns = Math.min(MAX, Math.max(MIN, view.s*factor));
  const wx=(sx-view.x)/view.s, wy=(sy-view.y)/view.s;
  view.s=ns; view.x=sx-wx*ns; view.y=sy-wy*ns; apply(animate);
}
function fitRect(r, animate=true){
  const vw=innerWidth, vh=innerHeight, padX=40, padTop=90, padBot=150;
  const s=Math.min(MAX, Math.max(MIN, Math.min((vw-padX*2)/r.w, (vh-padTop-padBot)/r.h)));
  view.s=s; view.x=(vw-r.w*s)/2 - r.x*s; view.y=padTop + ((vh-padTop-padBot)-r.h*s)/2 - r.y*s; apply(animate);
}
const center = () => [innerWidth/2, innerHeight/2];

document.getElementById("zoomIn").onclick = ()=>zoomAt(1.25,...center(),true);
document.getElementById("zoomOut").onclick = ()=>zoomAt(1/1.25,...center(),true);
document.getElementById("zoomLabel").onclick = ()=>zoomAt(1/view.s,...center(),true);
// "Ver todo": vista general un poco más cercana que el tablero completo, empezando por arriba
function fitWidth(animate=true){
  const b=bounds(), vw=innerWidth, vh=innerHeight;
  const byWidth=(vw-80)/b.w, byHeight=(vh-240)/b.h;
  const sc=Math.min(MAX,Math.max(MIN,Math.min(byWidth, byHeight*1.6)));
  view.s=sc; view.x=(vw-b.w*sc)/2 - b.x*sc; view.y=90 - b.y*sc; apply(animate);
}
document.getElementById("fit").onclick = ()=>{ current=-1; markActive(); fitWidth(); };
const sections = document.getElementById("sections");
FRAMES.forEach((f,i)=>{ const b=document.createElement("button"); b.innerHTML=`<i>${f.n}</i>${f.tab}`; b.onclick=()=>goTo(i); sections.appendChild(b); });
function markActive(){ [...sections.children].forEach((b,i)=>{ const on=i===current; b.classList.toggle("active",on); b.setAttribute("aria-current",on?"true":"false"); if(on) b.scrollIntoView({block:"nearest",inline:"nearest"}); }); }
let current=-1;
function goTo(i){
  if (i<0 || i>=FRAMES.length) return;
  current=i; const r=rect(els[FRAMES[i].id]);
  fitRect({x:r.x-20,y:r.y-60,w:r.w+40,h:r.h+80});
  markActive();
}
document.getElementById("prev").onclick=()=>goTo(current<=0?0:current-1);
document.getElementById("next").onclick=()=>goTo(Math.min(FRAMES.length-1,current+1));

viewport.addEventListener("wheel", e=>{
  if (e.target.closest("textarea") && !(e.ctrlKey||e.metaKey)) return;
  e.preventDefault();
  if (e.ctrlKey || e.metaKey){ zoomAt(Math.exp(-e.deltaY*0.0022), e.clientX, e.clientY); }
  else { view.x-=e.deltaX; view.y-=e.deltaY; apply(); }
},{passive:false});

// Punteros: pan, pinch, arrastre de post-its y frames
const pointers = new Map();
let mode=null, start=null, target=null, pinch=null;

viewport.addEventListener("pointerdown", e=>{
  if (e.target.closest("a, select, button")) return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (pointers.size===2){
    const [a,b]=[...pointers.values()];
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y), s:view.s, cx:(a.x+b.x)/2, cy:(a.y+b.y)/2, vx:view.x, vy:view.y};
    mode="pinch"; return;
  }
  mode="pan"; start={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,moved:false,frame:e.target.closest(".frame")};
  viewport.classList.add("panning");
  viewport.setPointerCapture(e.pointerId);
  hideHint();
});
viewport.addEventListener("pointermove", e=>{
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (mode==="pinch" && pointers.size===2){
    const [a,b]=[...pointers.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y), cx=(a.x+b.x)/2, cy=(a.y+b.y)/2;
    const ns=Math.min(MAX,Math.max(MIN,pinch.s*d/pinch.d));
    const wx=(pinch.cx-pinch.vx)/pinch.s, wy=(pinch.cy-pinch.vy)/pinch.s;
    view.s=ns; view.x=cx-wx*ns; view.y=cy-wy*ns; apply(); if(start) start.moved=true; return;
  }
  if (mode!=="pan" || !start) return;
  const dx=e.clientX-start.x, dy=e.clientY-start.y;
  if (Math.abs(dx)+Math.abs(dy)>6) start.moved=true;
  view.x=start.vx+dx; view.y=start.vy+dy; apply();
});
function end(e){
  pointers.delete(e.pointerId);
  if (mode==="pan" && start && !start.moved && start.frame && !viewport.classList.contains("zoomed")){
    const id=start.frame.id.replace("frame-",""); goTo(FRAMES.findIndex(f=>f.id===id));
  }
  if (pointers.size===0){ mode=null; start=null; pinch=null; viewport.classList.remove("panning"); }
}
viewport.addEventListener("pointerup", end);
viewport.addEventListener("pointercancel", end);

addEventListener("keydown", e=>{
  if (e.target.closest && e.target.closest("button, select, a")) return;
  if (e.key==="+"||e.key==="=") zoomAt(1.25,...center(),true);
  else if (e.key==="-") zoomAt(1/1.25,...center(),true);
  else if (e.key==="0"){ current=-1; markActive(); fitWidth(); }
  else if (e.key==="ArrowRight" || e.key==="PageDown") goTo(Math.min(FRAMES.length-1,current+1));
  else if (e.key==="ArrowLeft" || e.key==="PageUp") goTo(current<=0?0:current-1);
});

let hintTimer; const hint=document.getElementById("hint");

// Vista inicial: la cabecera y la primera fila, a un tamaño legible
function startRect(){
  const ids=ROWS[0].map(([id])=>id);
  let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;
  [brand, ...ids.map(id=>els[id])].forEach(e=>{ const r=rect(e); x1=Math.min(x1,r.x); y1=Math.min(y1,r.y-50); x2=Math.max(x2,r.x+r.w); y2=Math.max(y2,r.y+r.h); });
  return {x:x1-20,y:y1-20,w:x2-x1+40,h:y2-y1+40};
}
function init(){ layout(); drawWires(); fitRect(startRect(), false); }
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(init);
